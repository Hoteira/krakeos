[package]
name = "inkui"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
# common = { path = "../common" }
std = { path = "../std" }

titanf = { version = "2.3.3", default-features = false }
asvgard = { version = "0.2.3", default-features = false }

# Real graphics library (anti-aliased software 2D) + font rasteriser, replacing the
# hand-rolled renderer. Must stay no_std-clean to build under -Z build-std.
tiny-skia = { version = "0.11", default-features = false, features = ["no-std-float"] }
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }