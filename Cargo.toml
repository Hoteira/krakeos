[workspace]
members = [
    "apps/term",
    "apps/shell",
    "apps/sysmon",
    "apps/fps_test",
    "apps/aot_test",
    "apps/tmap",
    "apps/cat",
    "apps/taskbar",
    "inkui",
    "kernel",
    "std",
    "apps/shm_test",
    "apps/net_test",
    "apps/container_test",
    "apps/init",
    "apps/dummy",
    "apps/trivial_test",
    "userland", "ring3-rt",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Hoteira"]
edition = "2024"

[profile.dev]
panic = "abort"
opt-level = 2
lto = false

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1

